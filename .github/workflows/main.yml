name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天运行一次（UTC 00:00）
  workflow_dispatch:       # 手动触发
  push:
    branches:
      - main

permissions:
  contents: write   # ✅ 关键，允许写入仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake files
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
            dist/snake-sandal.svg?color_snake=#8B5E3C&color_dots=#EFE6D8,#DCC3A1,#C49A6C,#A0714A,#6E4A2F&color_dot_border=#E4D6C2
            dist/snake-sandal-dark.svg?color_snake=#D4B08A&color_dots=#2A211B,#5A3F2B,#7E5A3C,#A87D52,#D4B08A&color_dot_border=#1E1611

      - name: Push Snake files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
