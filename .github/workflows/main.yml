name: Generate profile images

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00（北京时间 08:00）
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-lilac.svg?color_snake=#8C7DBA&color_dots=#F1EFF5,#DCD6EA,#C3B8DE,#A596CC,#7E6FAE&color_dot_border=#E7E3EF
            dist/snake-lilac-dark.svg?color_snake=#C7BCEB&color_dots=#1E1C25,#352F4A,#4E446E,#6E5F9A,#9A8AC8&color_dot_border=#17161C

      - name: Generate header, status and quest cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet pillow
          python scripts/profile_gen.py gen-out
          sudo cp gen-out/* dist/   # dist/ is root-owned (written by the snk container)

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
