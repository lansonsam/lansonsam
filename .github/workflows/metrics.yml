name: Metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lansonsam
          filename: metrics.svg
          committer_branch: metrics
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Shanghai
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_colors: "0:#3F4248, 1:#5F6368, 2:#80858C, 3:#A2A6AC, 4:#C2C5C9, 5:#D9DBDE"
          extras_css: |
            h2, h2 a, .field a { color: #6E737A !important; }
            h2 svg, .field svg { fill: #9AA0A6 !important; }
            .field { color: #80858C !important; }
            [fill="#ebedf0"] { fill: #EDEEEF !important; }
            [fill="#9be9a8"] { fill: #C9CCD0 !important; }
            [fill="#40c463"] { fill: #9EA2A8 !important; }
            [fill="#30a14e"] { fill: #6E737A !important; }
            [fill="#216e39"] { fill: #4A4E54 !important; }
