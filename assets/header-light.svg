<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="lansonsam">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C9CBCF" opacity=".55"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#F4F4F2" stop-opacity="1"/>
      <stop offset=".55" stop-color="#F4F4F2" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F4F4F2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Inter','SF Pro Display','Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}
    .f{opacity:0;animation:in 1.2s ease-out forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}
    .orb{transform-origin:960px 130px;animation:spin 60s linear infinite}
    .orb2{transform-origin:960px 130px;animation:spin 90s linear infinite reverse}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="260" fill="#F4F4F2"/>
    <rect width="1200" height="260" fill="url(#dots)"/>
    <rect width="760" height="260" fill="url(#fadeR)"/>

    <g fill="none" stroke="#A9ACB1">
      <g class="orb">
        <circle cx="960" cy="130" r="92" stroke-opacity=".55"/>
        <circle cx="1052" cy="130" r="3" fill="#7D8187" stroke="none"/>
      </g>
      <g class="orb2">
        <circle cx="960" cy="130" r="62" stroke-opacity=".4" stroke-dasharray="2 6"/>
        <circle cx="960" cy="68" r="2.2" fill="#9A9EA4" stroke="none"/>
      </g>
      <circle cx="960" cy="130" r="30" stroke-opacity=".3"/>
    </g>
  </g>

  <text class="sans f d1" x="84" y="92" font-size="13" letter-spacing="4" fill="#9A9EA4">HELLO, I'M</text>
  <text class="sans f d2" x="80" y="160" font-size="66" font-weight="300" letter-spacing="-1" fill="#2B2D31">lansonsam</text>
  <text class="sans f d3" x="84" y="200" font-size="17" letter-spacing=".5" fill="#7D8187">Reverse engineering  ·  Networking  ·  Small, sharp tools</text>
</svg>
